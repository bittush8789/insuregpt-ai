apiVersion: apps/v1
kind: Deployment
metadata:
  name: insuregpt-app
  namespace: insuregpt
  labels:
    app.kubernetes.io/name: insuregpt-app
    app.kubernetes.io/part-of: insuregpt-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insuregpt-app
  template:
    metadata:
      labels:
        app: insuregpt-app
    spec:
      initContainers:
        # Wait until MySQL is accepting TCP connections on port 3306
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - "sh"
            - "-c"
            - >
              until nc -z -v -w3 mysql-service 3306; do
                echo "Waiting for MySQL service to become ready...";
                sleep 2;
              done;
              echo "MySQL is up and ready!";
      containers:
        - name: insuregpt
          image: insuregpt:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: insuregpt-config
            - secretRef:
                name: insuregpt-secret
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: insuregpt-service
  namespace: insuregpt
  labels:
    app.kubernetes.io/name: insuregpt-app
    app.kubernetes.io/part-of: insuregpt-system
spec:
  type: NodePort
  selector:
    app: insuregpt-app
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
      name: http
